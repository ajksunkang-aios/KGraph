name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create venv and install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip setuptools
          .venv/bin/pip install "protobuf>=7.35.0,<8"
          .venv/bin/pip install mcp pytest
          .venv/bin/python -c "import google.protobuf; print('protobuf:', google.protobuf.__version__)"

      - name: Run tests
        run: .venv/bin/python -m pytest tests/ -v --ignore=tests/real

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.1.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run integration tests
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip setuptools
          .venv/bin/pip install "protobuf>=7.35.0,<8" mcp pytest
          .venv/bin/python -m pytest tests/ -v --ignore=tests/real

  release:
    name: Build & Publish
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            # Strip leading 'v' if user typed v0.1.1 instead of 0.1.1
            RAW="${{ github.event.inputs.version }}"
          else
            RAW="${GITHUB_REF_NAME#v}"
          fi
          VERSION="${RAW#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing version: ${VERSION}"

      - name: Create tag (manual trigger only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="v${{ steps.version.outputs.VERSION }}"
          if git tag -l "$TAG" | grep -q .; then
            echo "Tag $TAG already exists, skipping."
          else
            git tag "$TAG"
            git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "$TAG"
          fi

      - name: Build platform bundle
        run: bash scripts/build-bundle.sh "${{ steps.version.outputs.VERSION }}"

      - name: Generate npm packages
        run: bash scripts/pack-npm.sh "${{ steps.version.outputs.VERSION }}"

      - name: Compute SHA256 checksums
        working-directory: release
        run: sha256sum *.tar.gz > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: KGraph v${{ steps.version.outputs.VERSION }}
          files: |
            release/*.tar.gz
            release/SHA256SUMS
          generate_release_notes: true

      - name: Setup Node.js for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure npm authentication
        run: npm config set //registry.npmjs.org/:_authToken ${{ secrets.KGRAPH_TOKEN }}

      - name: Publish platform package (linux-x64)
        run: npm publish release/npm/linux-x64/ --access public

      - name: Publish main package
        run: npm publish release/npm/main/ --access public

      - name: Verify published packages
        run: |
          sleep 10
          npm view @ajksunkang-aios/kgraph version || echo "WARN: main package not yet visible"
          npm view @ajksunkang-aios/kgraph-linux-x64 version || echo "WARN: platform package not yet visible"
